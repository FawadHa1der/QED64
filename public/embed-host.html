<!doctype html>
<!-- Test-only host page (dev server only: the production build copies nothing from public/ but workers/).
     tests/adversarial/reload-storm.mjs --embed loads it to reload QED64 the way an embedding site does: a
     minimal same-origin document whose only content is one iframe of the QED64 page given as ?src= (a
     same-origin path, default "/"). The dev server sends it with the same COOP/COEP headers as the app,
     so the frame is cross-origin isolated exactly as at the top level.
     ?ballast=<MiB> (HARDENING #55 residual) first fills the host page's own JS heap with that many MiB of
     small live objects, standing in for a heavy embedding page (the widgets gallery) that shares the
     renderer's 4 GiB pointer-compression cage with QED64's runtime. Plain objects, not typed arrays: an
     ArrayBuffer's backing store lives outside the cage. The reached size is window.__ballastBytes. -->
<meta charset="utf-8">
<title>QED64 embed host (test)</title>
<style>html, body { margin: 0; height: 100%; } iframe { display: block; border: 0; width: 100%; height: 100%; }</style>
<iframe id="qed64-frame" allow="clipboard-read; clipboard-write"></iframe>
<script>
  const params = new URLSearchParams(location.search);
  const ballastMiB = Math.max(0, Math.min(3072, Number(params.get("ballast")) || 0));
  if (ballastMiB > 0) {
    // ~32 bytes per {i, s} object plus its slot in the chunk array; keep it all reachable.
    const target = ballastMiB * 1048576, chunks = [];
    let made = 0;
    while (made < target) { const c = new Array(65536); for (let i = 0; i < c.length; i += 1) c[i] = { i, s: null }; chunks.push(c); made += 65536 * 40; }
    window.__ballast = chunks; window.__ballastBytes = made;
  }
  const src = params.get("src") || "/";
  document.getElementById("qed64-frame").src = src.startsWith("/") && !src.startsWith("//") ? src : "/";
</script>
