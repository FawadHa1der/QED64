name = "qed64"
main = "infra/worker.js"
compatibility_date = "2026-08-01"
# Serve on <name>.workers.dev (requires the one-time account-wide subdomain
# registration in the dashboard); attach a custom domain later via routes.
workers_dev = true

# dist/: the app shell plus QED64's two indexes (profiles/index.json and
# snapshots/index.json, copied from the tracked public/ files by the build, so
# one deploy pairs them with the shell and the release record: docs/DEPLOY.md
# "Atomic deploys"). Never the runtime, the packs or the .snapz: R2 serves them
# (the deploy script refuses them; Workers assets cap files at 25 MiB).
[assets]
directory = "dist"
binding = "ASSETS"
# Assets are served BEFORE the worker by default, which would skip the
# COOP/COEP headers the app cannot live without — run the worker for every
# request so withHeaders() applies to the shell too.
run_worker_first = true

[[r2_buckets]]
binding = "ARTIFACTS"
bucket_name = "qed64-artifacts"
