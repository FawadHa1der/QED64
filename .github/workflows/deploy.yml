# CD: pushes to main redeploy the APP SHELL to Cloudflare Workers (seconds,
# tiny). The shell is the lean4monaco editor (frontend/), built into dist/.
# Artifacts (multi-GB in R2) are uploaded manually via
# scripts/upload-artifacts.sh when a runtime or snapshot actually changes —
# GitHub runners neither need nor want the multi-GB payload.
# Required repo secrets: CLOUDFLARE_API_TOKEN (Workers Scripts: Edit only, no R2 permission: docs/DEPLOY.md "Security model") and CLOUDFLARE_ACCOUNT_ID.
name: deploy
on:
  push:
    branches: [main]
  workflow_dispatch:
# One deploy at a time: a run waits for the deploy before it, and a newer run replaces one still
# waiting, so deploys land in push order. A running deploy is never cancelled midway.
concurrency:
  group: qed64-deploy
  cancel-in-progress: false
jobs:
  deploy:
    # workflow_dispatch runs on whatever branch it is given: only main deploys.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: []
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json
      - run: npm ci
      # Both roots before any check: the root typecheck and the unit suite read
      # frontend/node_modules (lean4monaco's shipped files); pinned by
      # tests/unit/lean4monaco-fixes.test.ts for this workflow and ci.yml, and
      # with the step order below by tests/unit/deploy-script.test.ts.
      - run: npm ci --prefix frontend
      - run: npx tsc --noEmit && npx vitest run tests/unit
      # A re-run of an older run, or one that waited behind a newer push, must not deploy over a
      # newer commit: only the current head of main deploys.
      - run: test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$GITHUB_SHA" || { echo "deploy refused, $GITHUB_SHA is no longer the head of main (the newer head deploys in its own run)" >&2; exit 1; }
      # The one deploy path, shared with operators: typecheck:site, build:site,
      # the artifact prune, the 25 MiB size check, the live-snapshot guard
      # (scripts/deploy-guard.mjs, R19a) and `npx wrangler deploy` all live
      # in scripts/deploy-app.sh (its header says why). Env vars are
      # wrangler's native non-interactive auth; the account id spares
      # narrowly-scoped tokens the /accounts discovery call.
      - run: bash scripts/deploy-app.sh
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
