# CD: pushes to main redeploy the APP SHELL to Cloudflare Workers (seconds,
# tiny). The shell is the lean4monaco editor (frontend/), built into dist/.
# Artifacts (multi-GB in R2) are uploaded manually via
# scripts/upload-artifacts.sh when a runtime or snapshot actually changes —
# GitHub runners neither need nor want the multi-GB payload.
# Required repo secret: CLOUDFLARE_API_TOKEN (Workers+R2 edit permissions).
name: deploy
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    needs: []
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit && npx vitest run tests/unit
      - run: npm ci --prefix frontend
      - run: npm run typecheck:site
      - run: npm run build:site
      # Artifacts are served from R2 — never bundle them as worker assets
      # (publicDir is off for builds; this prune is a defensive invariant).
      - run: rm -rf dist/runtime dist/profiles dist/snapshots
      # Plain wrangler (pinned in devDependencies) instead of wrangler-action:
      # the wrapper swallowed error output on failure. Env vars are wrangler's
      # native non-interactive auth; the account id spares narrowly-scoped
      # tokens the /accounts discovery call.
      - run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
